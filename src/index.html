<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Planner</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-auth-pending>
  <header class="app-header">
    <h1>Daily Planner</h1>
    <div id="user-info" class="user-info" hidden>
      <span id="user-email"></span>
      <button type="button" id="logout-btn">Log out</button>
    </div>
  </header>

  <p id="auth-loading" class="auth-loading">Loading…</p>

  <main>
    <p id="sync-error" class="form-error sync-error" role="alert" hidden></p>
    <section id="week-strip" aria-label="Week navigation"></section>
    <section id="day-detail" aria-label="Tasks for selected day"></section>
  </main>

  <dialog id="task-dialog">
    <form id="task-form" method="dialog">
      <h2 id="task-dialog-title">Add Task</h2>

      <label for="task-title-input">Title</label>
      <input id="task-title-input" name="title" type="text" required maxlength="120" />

      <label for="task-time-input">Time (optional)</label>
      <input id="task-time-input" name="time" type="time" />

      <label for="task-notes-input">Notes (optional)</label>
      <textarea id="task-notes-input" name="notes" rows="3" maxlength="500"></textarea>

      <p id="task-form-error" class="form-error" hidden></p>

      <div class="dialog-actions">
        <button type="button" id="task-cancel-btn">Cancel</button>
        <button type="submit" id="task-save-btn">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/auth-guard.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
