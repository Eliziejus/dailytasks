<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — Daily Planner</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">
  <header class="app-header">
    <h1>Daily Planner</h1>
  </header>

  <main class="auth-main">
    <div class="auth-form">
      <h2>Log In</h2>

      <button type="button" id="google-signin-btn" class="google-btn">
        <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.88 2.69-6.64z" />
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.91-2.27c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.7H.96v2.34C2.44 15.98 5.48 18 9 18z" />
          <path fill="#FBBC05" d="M3.96 10.72c-.18-.54-.28-1.12-.28-1.72s.1-1.18.28-1.72V4.94H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.06l3-2.34z" />
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.94l3 2.34C4.67 5.16 6.66 3.58 9 3.58z" />
        </svg>
        Continue with Google
      </button>

      <div class="auth-divider"><span>or</span></div>

      <form id="login-form" novalidate>
        <label for="login-email-input">Email</label>
        <input id="login-email-input" name="email" type="email" required autocomplete="email" />

        <label for="login-password-input">Password</label>
        <input id="login-password-input" name="password" type="password" required autocomplete="current-password" />

        <p id="login-form-error" class="form-error" role="alert" hidden></p>

        <div class="dialog-actions">
          <button type="submit" id="login-submit-btn">Log In</button>
        </div>
      </form>

      <p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p>
    </div>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
