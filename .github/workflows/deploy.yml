# Deploy the static site (src/) to GitHub Pages
#
# One-time manual step required after this workflow is merged:
# Settings → Pages → Source → "GitHub Actions". Without that toggle,
# this workflow will run but Pages won't serve its output.

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./src"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
